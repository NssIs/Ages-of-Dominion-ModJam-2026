# The RTS camera is placed by hand, ignoring vanilla's third-person collision pull-in.
# Camera#setPosition is protected; this is the standard way to reposition it from an event.
public net.minecraft.client.Camera setPosition(Lnet/minecraft/world/phys/Vec3;)V

# The building catalog needs every block in a saved structure, and StructureTemplate's public API
# only offers filterBlocks(..., Block), which filters *to* one block type. Palette#blocks() with no
# argument returns all of them and is already public — the only thing in the way is the private
# list of palettes holding it. Reading this beats parsing the save() NBT by hand.
public-f net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate palettes
